<script id="report-data" type="application/json">{"generated_platform": "windows-latest", "summary": {"failed": 0, "passed": 13, "skipped": 0}, "tutorials": [{"meta": {"name": "Installed apps survive a restart \u2014 and a move: Basecamp persistence & portability", "output": "basecamp-persistence.md"}, "rows": [{"execs": [], "md": "# Installed apps survive a restart \u2014 and a move: Basecamp persistence & portability\n\nInstalling an app is only useful if it is still there tomorrow. This doc-test\nproves **persistence** \u2014 and then **portability** \u2014 with three launches of\nthe real, shippable Basecamp bundle:\n\n1. **Install** a local `.lgx` (a tiny QML-only app) the only way Basecamp\n   installs anything \u2014 through the bundled Package Manager app, confirmed by\n   Basecamp's **install gate** \u2014 and open it once to see it run.\n2. **Install a core module** the same way: a second `.lgx` whose payload is\n   *compiled code* (a shared library built hermetically from\n   `logos-test-modules`), routed through the very same gate.\n3. **Relaunch** the bundle against the same user-dir. No install events, no\n   gates, no reload workarounds this time: the boot-time scan rediscovers\n   both packages on disk \u2014 the app is back in the sidebar and renders its\n   payload, and the core module is back in the Module Inspector.\n4. **Move everything.** \"Portable\" is a claim about *place*, not just time:\n   copy the bundle out of the Nix store onto plain disk, prove the copy's\n   dynamic-link metadata carries not a single `/nix/store` reference, move\n   the user-dir to a different absolute path, delete the original `.lgx`\n   files \u2014 then launch a third time entirely from the moved copies. The app\n   and the module are still there, and the compiled payload still loads.\n\nThe persistence layer under test is the user dir: an installed app lands\nunder `<user-dir>/plugins/`, an installed core module under\n`<user-dir>/modules/`, and everything the second launch knows about either\ncomes from those files alone.\n\nThe run is **hermetic**: the app fixture is hand-crafted in the spec itself\n(see the package-lifecycle doc-test for the full anatomy of an `.lgx` \u2014\nthis spec reuses its recipe for a single version), the core-module fixture\nis built from the `logos-test-modules` flake via Nix and repacked into\nan `.lgx`, and everything installs into a throwaway `--user-dir`. The\nbundle does fetch its default repository's catalog in the background, but\nnothing from it is downloaded or installed here.\n\n**What you'll build:** The inspector-enabled Basecamp bundle and the logos-qt-mcp UI driver, two\nlocal `.lgx` packages \u2014 a hand-crafted QML-only app and a compiled core\nmodule repacked from a hermetic Nix build \u2014 and three headless UI runs:\nthe first installs both through Basecamp's install gate; the second\nrelaunches the bundle against the same user-dir and proves both survived\nthe restart; the third runs a store-free copy of the bundle against a\nmoved user-dir and proves the whole arrangement is portable.\n\n\n**What you'll learn:**\n\n- Where installed packages live \u2014 apps under the user dir's `plugins/`, core modules under its `modules/` \u2014 and that those files are the only thing a restart needs\n- That a compiled core module travels the exact same `.lgx` + install-gate path as a QML app; only the payload differs\n- That a relaunched Basecamp rediscovers installed packages from disk alone \u2014 sidebar entry, Module Inspector row, metadata, and payload \u2014 with no install events involved\n- What \"portable\" means mechanically \u2014 every dynamic-link reference in the shipped bundle is `@rpath`/`$ORIGIN`-relative or a system library, so a byte-for-byte folder copy runs from any path, with no Nix store behind it\n- That the installed state is path-independent too \u2014 a moved user-dir, with the original `.lgx` files deleted, still yields the app and a loadable module\n- Why the first launch needs a manual reload after a local app install (a current stack bug) while a fresh boot does not\n- How to drive a multi-launch scenario headlessly with logos-qt-mcp\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **Windows:** the outputs the build steps below link, staged as `bin-bundle-dir-inspector/`, `logos-qt-mcp/`, `lgx/` and `port-test_fullapi_cpp/`, plus Git Bash, Python 3 and Node.js.\n- **Linux, macOS or Windows.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required. Network access is needed to fetch the flakes and the Nix binary cache; during the run Basecamp may refresh its default catalog in the background, but no catalog packages are downloaded or installed here.\n- **If upgrading from Basecamp 0.1.1 or lower:**\n\n> \u26a0\ufe0f **Please clear your user dir before running** \u26a0\ufe0f\n>\n> - macOS: `~/Library/Application Support/Logos/LogosBasecamp`\n> - Linux: `~/.config/Logos/LogosBasecamp` or `~/.local/share/Logos/LogosBasecamp`\n\nPackage state written by Basecamp 0.1.1 or older is not compatible with the\ninstall flow driven here. This doc-test itself is unaffected \u2014 it isolates\neverything under a throwaway `--user-dir` \u2014 but if you follow along against\nyour real Basecamp install (i.e. run the bundle *without* `--user-dir`), a\nstale user dir from an old version can make installs misbehave."}, {"execs": [], "md": "## Step 1: Build the UI test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) is the harness\nthe doc-test uses to connect to the app's QML inspector and drive it."}, {"execs": [], "md": "### 1.1 Build logos-qt-mcp\n\n```bash\nnix build 'github:logos-co/logos-basecamp#logos-qt-mcp' -o logos-qt-mcp\n```"}, {"execs": [], "md": "### 1.2 Build the lgx packaging CLI\n\n[`lgx`](https://github.com/logos-co/logos-package) is the packaging\ntool \u2014 used below to add the payload to the fixture package and stamp\nits content hashes.\n\n```bash\nnix build 'github:logos-co/logos-package#lgx' -o lgx\n```"}, {"execs": [], "md": "## Step 2: Build the Basecamp bundle\n\nBuild **this** basecamp commit as the portable bundle \u2014 the same\nself-contained directory you ship, with the QML inspector compiled in so\nthe driver can attach (`#bin-bundle-dir-inspector`, the inspector-enabled\ntwin of `#bin-bundle-dir`)."}, {"execs": [], "md": "### 2.1 Build the bundle\n\n```bash\n# From inside the clone this is simply: nix build '.#bin-bundle-dir-inspector'\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' -o bin-bundle-dir-inspector\n```"}, {"execs": [], "md": "### 2.2 Build the core module the second fixture repacks\n\n`test_fullapi_cpp` from\n[`logos-test-modules`](https://github.com/logos-co/logos-test-modules),\nas a portable install output: the same hermetic source the full-API\ndoc-tests use, so it is known to load inside the bundle.\n\n```bash\nSYSTEM=$(nix eval --impure --raw --expr 'builtins.currentSystem')\nnix build \"${TEST_MODULES_FLAKE:-github:logos-co/logos-test-modules}#modules.$SYSTEM.test_fullapi_cpp.install-portable\" -o port-test_fullapi_cpp\n\n```"}, {"execs": [], "md": "## Step 3: Craft the LGX fixture packages: an app and a core module\n\nTwo fixtures. First a QML-only (`ui_qml`) app, version 0.1.1. An `.lgx` is a gzipped\n**ustar** tar: a `manifest.json` at the root and the payload under\n`variants/<platform>/` \u2014 for a QML-only app the payload is three tiny\ntext files. The manifest must carry content hashes, so the package is\nbuilt in two moves: seed a tar with just the manifest, then let\n[`lgx add`](https://github.com/logos-co/logos-package) inject the\npayload and stamp the hashes. (The package-lifecycle doc-test walks\nthis anatomy in detail.)\n\nThe manifest's `display_name` (\"Persistence Demo\") is what Basecamp\nshows in the sidebar; its `name` (`test_persist_qml`) must match the\nQML module URI declared in `qmldir`."}, {"execs": [{"cmd": "write build/persist/manifest.json", "exit_code": 0, "kind": "file", "output": "wrote build/persist/manifest.json\n", "status": "pass"}], "md": "### 3.1 Write the manifest\n\nA `ui_qml` package has no binary entry points, so `main` stays empty\nand `view` names the QML file to load:\n\n```json\n{\n  \"author\": \"\",\n  \"category\": \"testing\",\n  \"dependencies\": [],\n  \"description\": \"Persistence doc-test fixture (QML-only app)\",\n  \"display_name\": \"Persistence Demo\",\n  \"icon\": \"\",\n  \"main\": {},\n  \"manifestVersion\": \"0.3.0\",\n  \"name\": \"test_persist_qml\",\n  \"type\": \"ui_qml\",\n  \"version\": \"0.1.1\",\n  \"view\": \"Main.qml\"\n}\n```"}, {"execs": [{"cmd": "write build/persist/payload/metadata.json", "exit_code": 0, "kind": "file", "output": "wrote build/persist/payload/metadata.json\n", "status": "pass"}], "md": "### 3.2 Write the module metadata\n\n```json\n{\n  \"name\": \"test_persist_qml\",\n  \"display_name\": \"Persistence Demo\",\n  \"version\": \"0.1.1\",\n  \"type\": \"ui_qml\",\n  \"category\": \"testing\",\n  \"description\": \"Persistence doc-test fixture (QML-only app)\",\n  \"view\": \"Main.qml\",\n  \"dependencies\": []\n}\n```"}, {"execs": [{"cmd": "write build/persist/payload/Main.qml", "exit_code": 0, "kind": "file", "output": "wrote build/persist/payload/Main.qml\n", "status": "pass"}], "md": "### 3.3 Write the QML view\n\nThe app's whole UI. It prints its own version, so the second launch\ncan prove not just that *an* app came back but that the exact\ninstalled payload did:\n\n```qml\nimport QtQuick\n\nRectangle {\n    id: root\n    color: \"#1e1e1e\"\n    Text {\n        anchors.centerIn: parent\n        text: \"Persistence demo view v0.1.1\"\n        color: \"#ffffff\"\n        font.pixelSize: 24\n    }\n}\n```"}, {"execs": [{"cmd": "write build/persist/payload/qmldir", "exit_code": 0, "kind": "file", "output": "wrote build/persist/payload/qmldir\n", "status": "pass"}], "md": "### 3.4 Write the qmldir\n\n```text\nmodule com.logos.module.test_persist_qml\n```"}, {"execs": [], "md": "### 3.5 Pick the platform variant and where the packages go\n\n```bash\ncase \"$(uname -s) $(uname -m)\" in\n  \"Linux x86_64\")   VARIANT=linux-x86_64 ;;\n  \"Linux aarch64\")  VARIANT=linux-arm64 ;;\n  \"Darwin arm64\")   VARIANT=darwin-arm64 ;;\n  \"Darwin x86_64\")  VARIANT=darwin-x86_64 ;;\n  *) echo \"unsupported platform: $(uname -sm)\" >&2; exit 1 ;;\nesac\necho \"$VARIANT\" > build/persist/variant\necho /tmp/basecamp-persist > build/persist/dir\ncat build/persist/variant build/persist/dir\n\n```"}, {"execs": [{"cmd": "echo windows-x86_64 > build/persist/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-persist\" > build/persist/dir\ncat build/persist/variant build/persist/dir\n", "exit_code": 0, "kind": "run", "output": "windows-x86_64\n/d/tmp/basecamp-persist\n", "status": "pass"}], "md": "### 3.6 On Windows: the platform variant and where the packages go\n\nThe app turns `file:///tmp/basecamp-persist/\u2026` into `\\tmp\\basecamp-persist\\\u2026`\non the drive it runs from, while Git Bash's `/tmp` is the user's temp\ndirectory. So the packages go to that drive's `\\tmp`.\n\n```bash\necho windows-x86_64 > build/persist/variant\ncygpath -u \"$(pwd -W | cut -c1-2)/tmp/basecamp-persist\" > build/persist/dir\ncat build/persist/variant build/persist/dir\n\n```"}, {"execs": [{"cmd": "set -e\nVARIANT=$(cat build/persist/variant)\nDIR=$(cat build/persist/dir)\nchmod -R u+w \"$DIR\" 2>/dev/null || true\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nseed=\"build/persist/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/persist/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_persist_qml-0.1.1.lgx\" manifest.json variants\n./lgx/bin/lgx.exe add \"$DIR/test_persist_qml-0.1.1.lgx\" \\\n  --variant \"$VARIANT\" --files build/persist/payload -y\n./lgx/bin/lgx.exe verify \"$DIR/test_persist_qml-0.1.1.lgx\"\nchmod -R u+w testdata/persist-user 2>/dev/null || true\nrm -rf testdata/persist-user\nmkdir -p testdata/persist-user/modules testdata/persist-user/plugins\nls \"$DIR\"\n", "exit_code": 0, "kind": "run", "output": "Added variant 'windows-x86_64' to D:/tmp/basecamp-persist/test_persist_qml-0.1.1.lgx\nPackage structure is valid: D:/tmp/basecamp-persist/test_persist_qml-0.1.1.lgx\nPackage is unsigned\ntest_persist_qml-0.1.1.lgx\n", "status": "pass"}], "md": "### 3.7 Pack the .lgx and prepare an empty user-dir\n\nSeed the package with the\nmanifest (plain **ustar** \u2014 the LGX reader doesn't speak macOS\n`tar`'s default pax headers), `lgx add` the payload, and verify. The\narchives land at a **fixed absolute path** (`/tmp/basecamp-persist/`)\nbecause the UI run passes them into the app over the inspector as\nliteral `file://` URLs \u2014 the harness bakes those into the generated\ntest verbatim, so no relative or per-run path can work there. Only\nthe two archives live under `/tmp`; every other artifact stays in\nthe working directory. The fresh, empty `--user-dir`\ncreated alongside is the star of this spec \u2014 it is the only thing\nthat carries state from the first launch to the second.\n\n```bash\nset -e\nVARIANT=$(cat build/persist/variant)\nDIR=$(cat build/persist/dir)\nchmod -R u+w \"$DIR\" 2>/dev/null || true\nrm -rf \"$DIR\"\nmkdir -p \"$DIR\"\nseed=\"build/persist/seed\"\nrm -rf \"$seed\"\nmkdir -p \"$seed/variants\"\ncp build/persist/manifest.json \"$seed/manifest.json\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_persist_qml-0.1.1.lgx\" manifest.json variants\n./lgx/bin/lgx add \"$DIR/test_persist_qml-0.1.1.lgx\" \\\n  --variant \"$VARIANT\" --files build/persist/payload -y\n./lgx/bin/lgx verify \"$DIR/test_persist_qml-0.1.1.lgx\"\nchmod -R u+w testdata/persist-user 2>/dev/null || true\nrm -rf testdata/persist-user\nmkdir -p testdata/persist-user/modules testdata/persist-user/plugins\nls \"$DIR\"\n\n```"}, {"execs": [{"cmd": "set -e\nDIR=$(cat build/persist/dir)\nSRC=port-test_fullapi_cpp/modules/test_fullapi_cpp\nVARIANT=$(cat \"$SRC/variant\")\npayload=build/persist/module-payload\nseed=build/persist/module-seed\nrm -rf \"$payload\" \"$seed\"\nmkdir -p \"$payload\" \"$seed/variants\"\nfor f in \"$SRC\"/*; do\n  base=$(basename \"$f\")\n  [ \"$base\" = \"manifest.json\" ] && continue\n  [ \"$base\" = \"variant\" ] && continue\n  cp -RL \"$f\" \"$payload/\"\ndone\n# Seed the manifest with the version pinned to a spec-owned 0.0.1:\n# the install gate's dialog text embeds the version, and the UI\n# runner's text assertions are exact-match, so a spec-owned version\n# keeps that text deterministic whatever version upstream ships.\npython3 - \"$SRC/manifest.json\" \"$seed/manifest.json\" <<'PY'\nimport json, sys\nmanifest = json.load(open(sys.argv[1]))\nmanifest[\"version\"] = \"0.0.1\"\njson.dump(manifest, open(sys.argv[2], \"w\"), indent=2)\nPY\nchmod -R u+w \"$payload\" \"$seed\"\n# The module's entry point (per-variant `main` in its manifest,\n# e.g. test_fullapi_cpp_plugin.dylib) \u2014 lgx add needs it explicitly\n# when the payload is a directory.\nMAIN=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[\"main\"].get(sys.argv[2], \"\"))' \"$SRC/manifest.json\" \"$VARIANT\")\n[ -n \"$MAIN\" ]\necho \"main: $MAIN (upstream version: $(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[\"version\"])' \"$SRC/manifest.json\"))\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_fullapi_cpp.lgx\" manifest.json variants\n./lgx/bin/lgx.exe add \"$DIR/test_fullapi_cpp.lgx\" \\\n  --variant \"$VARIANT\" --files \"$payload\" --main \"$MAIN\" -y\n./lgx/bin/lgx.exe verify \"$DIR/test_fullapi_cpp.lgx\"\nls \"$DIR\"\n", "exit_code": 0, "kind": "run", "output": "main: test_fullapi_cpp_plugin.dll (upstr ts manifest,\n# e.g. test_fullapi_cpp_plugin.dylib) \u2014 lgx add needs it explicitly\n# when the payload is a directory.\nMAIN=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[\"main\"].get(sys.argv[2], \"\"))' \"$SRC/manifest.json\" \"$VARIANT\")\n[ -n \"$MAIN\" ]\necho \"main: $MAIN (upstream version: $(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[\"version\"])' \"$SRC/manifest.json\"))\"\ntar --format ustar -C \"$seed\" -czf \"$DIR/test_fullapi_cpp.lgx\" manifest.json variants\n./lgx/bin/lgx add \"$DIR/test_fullapi_cpp.lgx\" \\\n  --variant \"$VARIANT\" --files \"$payload\" --main \"$MAIN\" -y\n./lgx/bin/lgx verify \"$DIR/test_fullapi_cpp.lgx\"\nls \"$DIR\"\n\n```"}, {"execs": [], "md": "## Step 4: First launch: install the app and the core module\n\nLaunch the bundle headless against the empty user-dir and install the\nfixture the only way Basecamp installs anything: the bundled **Package\nManager** app (`package_manager_ui`) initiates, Basecamp's install gate\nconfirms. The local-file install goes through PMU's own code path\n(`installLocalPackage` \u2014 the same slot its \"Select LGX Package\" file\npicker reaches, which a headless driver can't operate), invoked via the\ninspector on PMU's `pmui.BackendStore` hook with an explicit `file://`\nURL. The gate's confirm button is clicked by its stable `objectName`."}, {"execs": [{"actions": [{"description": "App window opens with the sidebar visible: wait for ['Applications', 'Settings']", "duration_ms": 79, "index": 1, "status": "pass"}, {"description": "Open the Package Manager: click 'Package Manager'", "duration_ms": 1, "index": 2, "status": "pass"}, {"description": "The Package Manager view loads: wait for ['Manage your plugins and packages.']", "duration_ms": 511, "index": 3, "status": "pass"}, {"description": "Let its backend connections settle: sleep 3000ms", "duration_ms": 3005, "index": 4, "status": "pass"}, {"description": "Hand the package to the Package Manager: ely from the moved copies:\na machine without Nix would see exactly what this launch sees."}, {"execs": [{"cmd": "set -e\n# chmod before rm: a stale moved/ from a previous run holds\n# read-only directories copied out of the store, which rm -rf\n# alone cannot remove.\nchmod -R u+w build/persist/moved 2>/dev/null || true\nrm -rf build/persist/moved\nmkdir -p build/persist/moved/bundle\ncp -R bin-bundle-dir-inspector/. build/persist/moved/bundle\nchmod -R u+w build/persist/moved/bundle\n# Windows can keep a file of the stopped app open for a moment.\nfor try in 1 2 3 4 5; do\n  mv testdata/persist-user build/persist/moved/user && break\n  sleep 2\ndone\nrm -f \"$(cat build/persist/dir)\"/*.lgx\n# List the moved tree AND the installed payloads inside it \u2014 the\n# plugins/ and modules/ dirs themselves were pre-created empty, so\n# only their contents prove the installs are coming along.\nls build/persist/moved build/persist/moved/user/plugins build/persist/moved/user/modules\n", "exit_code": 0, "kind": "run", "output": "build/persist/moved:\nbundle\nuser\n\nbuild/persist/moved/user/modules:\ntest_fullapi_cpp\n\nbuild/persist/moved/user/plugins:\ntest_persist_qml\n", "status": "pass"}], "md": "### 6.1 Copy the bundle out of the store, move the user-dir\n\n`cp -R` on the out-link is the honest test: it follows the\n`bin-bundle-dir-inspector` symlink but preserves the symlinks *inside* the\nbundle (all relative \u2014 Qt framework `Versions/Current` links and\nthe like), so the copy is exactly what a user gets by copying the\nfolder. The user-dir is **moved**, not copied, and the source\n`.lgx` files are deleted \u2014 if anything in the stack remembered the\nold user-dir path or the install-source path, the third launch\nwould notice.\n\n```bash\nset -e\n# chmod before rm: a stale moved/ from a previous run holds\n# read-only directories copied out of the store, which rm -rf\n# alone cannot remove.\nchmod -R u+w build/persist/moved 2>/dev/null || true\nrm -rf build/persist/moved\nmkdir -p build/persist/moved/bundle\ncp -R bin-bundle-dir-inspector/. build/persist/moved/bundle\nchmod -R u+w build/persist/moved/bundle\n# Windows can keep a file of the stopped app open for a moment.\nfor try in 1 2 3 4 5; do\n  mv testdata/persist-user build/persist/moved/user && break\n  sleep 2\ndone\nrm -f \"$(cat build/persist/dir)\"/*.lgx\n# List the moved tree AND the installed payloads inside it \u2014 the\n# plugins/ and modules/ dirs themselves were pre-created empty, so\n# only their contents prove the installs are coming along.\nls build/persist/moved build/persist/moved/user/plugins build/persist/moved/user/modules\n\n```"}, {"execs": [], "md": "### 6.2 Prove the copy is self-contained: zero store references in its dynamic-link metadata\n\nRaw bytes are the wrong thing to grep \u2014 harmless `/nix/store`\nstrings survive in debug text. What decides whether the copy runs\non a store-less machine is the **dynamic-link metadata**: Mach-O\nload commands (macOS, read with `otool` from the Xcode command-line\ntools) or the resolved shared-library set (Linux, read with `ldd`).\nEvery dependency must be `@rpath`/`@loader_path`/`$ORIGIN`-relative,\ninside the bundle, or a system library \u2014 never a store path.\n\n```bash\nset -e\nBUNDLE=build/persist/moved/bundle\ncase \"$(uname -s)\" in\n  Darwin) list_dynlinks() { otool -l \"$1\"; } ;;\n  Linux)  list_dynlinks() { ldd \"$1\" 2>/dev/null || true; } ;;\nesac\n# A file list + while-read instead of for-in-$(...): survives\n# whitespace in paths and keeps the counters in this shell. An\n# empty list falls through to \"scanned 0\", which fails the\n# expectation below rather than aborting mid-script.\nfind \"$BUNDLE\" -type f -exec file {} + | grep -E \"Mach-O|ELF\" | cut -d: -f1 > build/persist/dynobjects.txt || true\ntotal=0; bad=0\nwhile IFS= read -r f; do\n  total=$((total+1))\n  if list_dynlinks \"$f\" | grep -q \"/nix/store\"; then\n    bad=$((bad+1)); echo \"STORE-REF: $f\"\n  fi\ndone < build/persist/dynobjects.txt\necho \"scanned $total dynamic objects, $bad with store references\"\nif [ \"$total\" -gt 0 ] && [ \"$bad\" -eq 0 ]; then\n  echo \"BUNDLE-IS-SELF-CONTAINED\"\nfi\n\n```"}, {"execs": [{"cmd": "write build/persist/pe_imports.py", "exit_code": 0, "kind": "file", "output": "wrote build/persist/pe_imports.py\n", "status": "pass"}], "md": "### 6.3 On Windows: where every import of the copy resolves\n\nA Windows PE names the DLLs it imports by file name alone, so there is\nno store path to look for. Nor can the launch below settle it: Git\nBash's `PATH` would quietly lend the copy a DLL it lacks. What decides\nit is where each import resolves \u2014 next to the importing file, in the\nbundle's `bin/`, or in Windows itself. This script reads the import\nand delay-load tables of every `.exe` and `.dll` in the copy.\n\n```python\nimport os, struct, sys\n\n# Windows' own DLLs, as logos-windows-ci's import-closure gate lists them.\nWINDOWS = set(\"\"\"\n    kernel32 ntdll user32 advapi32 ws2_32 mswsock shell32 ole32 oleaut32 version\n    winmm netapi32 userenv authz mpr crypt32 bcrypt bcryptprimitives secur32\n    dbghelp psapi imm32 gdi32 comdlg32 shlwapi iphlpapi dnsapi wtsapi32 setupapi\n    winspool rpcrt4 msvcrt uxtheme dwmapi d3d9 d3d11 d3d12 dxgi dwrite opengl32\n    wldap32 normaliz winhttp wininet ncrypt cfgmgr32 powrprof propsys oleacc avrt\n    ucrtbase d2d1 shcore odbc32\n\"\"\".split())\n\n\ndef imported_dlls(data):\n    \"\"\"The DLL names in a PE's import and delay-load import tables.\"\"\"\n    pe = struct.unpack_from(\"<I\", data, 0x3C)[0]\n    sections, = struct.unpack_from(\"<H\", data, pe + 6)\n    optional_size, = struct.unpack_from(\"<H\", data, pe + 20)\n    optional = pe + 24\n    pe32_plus = struct.unpack_from(\"<H\", data, optional)[0] == 0x20B\n    directories = optional + (112 if pe32_plus else 96)\n    table = [struct.unpack_from(\"<IIII\", data, optional + optional_size + 40 * i + 8)\n             for i in range(sections)]\n\n    def offset(rva):\n        for size, address, raw_size, raw in table:\n            if address <= rva < address + max(size, raw_size):\n                return rva - address + raw\n        return None\n\n    names = []\n    # (data directory entry, descriptor size, offset of its name field)\n    for entry, size, name_field in ((1, 20, 12), (13, 32, 4)):\n        rva, = struct.unpack_from(\"<I\", data, directories + 8 * entry)\n        at = offset(rva) if rva else None\n        while at is not None:\n            name_rva, = struct.unpack_from(\"<I\", data, at + name_field)\n            if not name_rva:\n                break\n            start = offset(name_rva)\n            names.append(data[start:data.index(b\"\\0\", start)].decode(\"ascii\", \"replace\"))\n            at += size\n    return names\n\n\nbundle = sys.argv[1]\nbin_names = {n.lower() for n in os.listdir(os.path.join(bundle, \"bin\"))}\nscanned, outside = 0, []\nfor directory, _, files in os.walk(bundle):\n    here = {n.lower() for n in os.listdir(directory)}\n    for name in files:\n        if not name.lower().endswith((\".exe\", \".dll\")):\n            continue\n        path = os.path.join(directory, name)\n        with open(path, \"rb\") as f:\n            data = f.read()\n        if data[:2] != b\"MZ\":\n            continue\n        scanned += 1\n        for dll in imported_dlls(data):\n            low = dll.lower()\n            if low.startswith((\"api-ms-win-\", \"ext-ms-\")) or os.path.splitext(low)[0] in WINDOWS:\n                continue\n            if low not in here and low not in bin_names:\n                outside.append(os.path.relpath(path, bundle) + \" -> \" + dll)\n\nfor line in outside:\n    print(\"RESOLVES OUTSIDE THE BUNDLE:\", line)\nqt_conf = os.path.join(bundle, \"bin\", \"qt.conf\")\nrelative = not os.path.exists(qt_conf) or \"/nix/store\" not in open(qt_conf).read()\nprint(\"scanned\", scanned, \"PE files;\", len(outside), \"imports resolve outside the bundle;\",\n      \"qt.conf is relative\" if relative else \"qt.conf names the store\")\nif scanned and not outside and relative:\n    print(\"BUNDLE-IS-SELF-CONTAINED\")\n```"}, {"execs": [{"cmd": "python3 build/persist/pe_imports.py build/persist/moved/bundle", "exit_code": 0, "kind": "run", "output": "scanned 202 PE files; 0 imports resolve outside the bundle; qt.conf is relative\nBUNDLE-IS-SELF-CONTAINED\n", "status": "pass"}], "md": "### 6.4 On Windows: prove the copy is self-contained\n\n```bash\npython3 build/persist/pe_imports.py build/persist/moved/bundle\n```"}, {"execs": [{"actions": [{"description": "The relocated bundle boots against the relocated user-dir: wait for ['Applications', 'Settings']", "duration_ms": 68, "index": 1, "status": "pass"}, {"description": "The installed app survived the move: wait for ['Persistence Demo']", "duration_ms": 4, "index": 2, "status": "pass"}, {"description": "Open the app from the sidebar: click 'Persistence Demo'", "duration_ms": 1, "index": 3, "status": "pass"}, {"description": "Its payload renders from the moved user-dir: wait for ['Persistence demo view v0.1.1']", "duration_ms": 560, "index": 4, "status": "pass"}, {"description": "Open Settings: click 'Settings'", "duration_ms": 2, "index": 5, "status": "pass"}, {"description": "Settings loads: wait for ['Manage modules, apps and dashboards.', 'Sections']", "duration_ms": 50, "index": 6, "status": "pass"}, {"description": "Open the Module Inspector: click 'Module Inspector'", "duration_ms": 2, "index": 7, "status": "pass"}, {"description": "Filter the module table down to the fixture: set objectName='moduleInspectorView' .searchText to 'test_fullapi_cpp'", "duration_ms": 16, "index": 8, "status": "pass"}, {"description": "The core module survived the move: wait for ['test_fullapi_cpp', 'Not loaded']", "duration_ms": 12, "index": 9, "status": "pass"}, {"description": "Load the moved module: click objectName='moduleRow.loadToggle.test_fullapi_cpp'", "duration_ms": 8, "index": 10, "status": "pass"}, {"description": "Give the runtime time to load the shared library: sleep 10000ms", "duration_ms": 10003, "index": 11, "status": "pass"}, {"description": "The compiled payload loads from its new location: expect objectName='moduleInspector.status.test_fullapi_cpp' .text == 'Loaded'", "duration_ms": 85, "index": 12, "status": "pass"}], "cmd": "env HOME=\"$PWD/testdata/persist-home\" USERPROFILE=\"$PWD/testdata/persist-home\" LOGOS_NO_SCHEME_REGISTER=1 ./build/persist/moved/bundle/bin/LogosBasecamp.exe --user-dir \"$PWD/build/persist/moved/user\"", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Installed apps survive a restart \u2014 and a move: Basecamp persistence & portability: Launch from the moved copies and verify everything still works\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 6.5 Launch from the moved copies and verify everything still works\n\n```bash\nenv HOME=\"$PWD/testdata/persist-home\" USERPROFILE=\"$PWD/testdata/persist-home\" LOGOS_NO_SCHEME_REGISTER=1 ./build/persist/moved/bundle/bin/LogosBasecamp --user-dir \"$PWD/build/persist/moved/user\"\n```\n\nSame binary bits, entirely new paths: the bundle runs from plain disk outside the store, the user-dir sits at a path Basecamp has never seen, and the `.lgx` files the installs came from no longer exist.\n\n![The relocated bundle boots against the relocated user-dir](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAIAAAB2L2r1AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeXxU5d3//+ucM2dmMpOFPRKQAIEEZJFNBUEBQamACFUBxQVQVCwtLret6G2/XWzvPiwtRXuLLaJi+8AVsYDKooILBGSVzQTZlyQkbAlJZj3n/P44d+c3DSEZkllOktfzjz5mzpy5rmumfGTOm+u6jpSeni4ipqqqzWaTZVmSJPN/I39vHBiGoeu6+b/BYDAQCCR6RAAAAAAAAKgvWyQnybLscDhUVbVaYlWFJEmKopiP7Xa7YRiBQMDn8+m6ntiBAQAAAAAAoM5qD7CcTqfD4YjDUKJOkiS73W63230+n9frTfRwAAAAAAAAUBc1BViyLLtcrtCcpobL4XDYbLbKykqmYgEAAAAAADQ48qVeUBTF7XY3gvTK1Mg+DgAAAAAAQNNRfYBlzr2S5UvGWw1Ro/x <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
